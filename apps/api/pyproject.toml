[project]
name = "replaytutor-api"
version = "0.1.0"
description = "Local-first ReplayTutor API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.scripts]
replaytutor = "replaytutor.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replaytutor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../../tests/backend"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
