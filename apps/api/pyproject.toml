[project]
name = "replaytutor-api"
version = "0.1.0a2"
description = "Local-first ReplayTutor API"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "duckdb==1.4.4",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pyarrow==23.0.1",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.31",
  "pytz==2025.2",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.scripts]
replaytutor = "replaytutor.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.151.9",
  "playwright==1.61.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replaytutor"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["replaytutor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../../tests/backend"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
