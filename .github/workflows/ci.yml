name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          corepack enable
          ./scripts/pnpm install --frozen-lockfile
          ./scripts/uv sync --project apps/api --frozen

      - name: Install Playwright Chromium
        run: ./scripts/uv run --project apps/api playwright install --with-deps chromium

      - name: Run static, unit, and build gates
        run: make verify

      - name: Run isolated browser tests
        run: make e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
