name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          corepack enable
          ./scripts/pnpm install --frozen-lockfile
          ./scripts/uv sync --project apps/api --frozen

      - name: Install Playwright Chromium
        run: ./scripts/uv run --project apps/api playwright install --with-deps chromium

      - name: Run static, unit, and build gates
        run: make verify

      - name: Run isolated browser tests
        run: make e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release acceptance artifacts
        if: ${{ always() && hashFiles('test-results/release-acceptance-*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-acceptance-artifacts
          path: |
            test-results/release-acceptance-*
          if-no-files-found: error
          retention-days: 14
