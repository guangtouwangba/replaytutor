name: Bug report
description: Report a reproducible ReplayTutor problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private fills, databases, or Agent workspaces."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, route, locale, market, and timeframe.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ReplayTutor version or commit
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private trading data.
          required: true
